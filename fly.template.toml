# fly.template.toml - Yeni firma deploy şablonu
# Kullanım:
#   1. REPLACE_WITH_* alanlarını firma bilgileriyle değiştir
#   2. fly deploy --app <firma-slug> -c fly.firma.toml
#   veya deploy-firma.ps1 scriptini kullan

app = 'REPLACE_WITH_APP_NAME'
primary_region = 'ams'

[env]
  DB_PATH = '/app/data/fiyatlar.db'
  PORT = '3000'
  COMPANY_NAME = 'REPLACE_WITH_COMPANY_NAME'
  COMPANY_SLUG = 'REPLACE_WITH_COMPANY_SLUG'
  APP_URL = 'REPLACE_WITH_APP_URL'
  ADMIN_DEFAULT_PASSWORD = 'REPLACE_WITH_ADMIN_PASSWORD'

[[mounts]]
  source = 'REPLACE_WITH_VOLUME_NAME'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512MB'
