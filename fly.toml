# fly.toml app configuration file generated for fiyat-takip on 2026-06-25T11:08:18+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'esamoda'
primary_region = 'ams'

[env]
  DB_PATH = '/app/data/fiyatlar.db'
  PORT = '3000'
  COMPANY_NAME = 'ESA MODA'
  COMPANY_SLUG = 'esamoda'
  APP_URL = 'https://esamoda.fly.dev'
  ADMIN_DEFAULT_PASSWORD = 'admin123'

[[mounts]]
  source = 'esamoda_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512MB'
